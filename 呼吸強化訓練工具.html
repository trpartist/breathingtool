</style></head><body><main>
<header><div><h1>呼吸強化訓練工具</h1><small>方形呼吸法。跟著光點，鍛鍊氣息。</small></div><span class="hint">空白鍵：開始／暫停<br>F：全螢幕 · Esc：離開</span></header>
<div id="stage"><div class="fullscreen-title">呼吸強化訓練工具</div><canvas id="visual" width="1600" height="900" role="img" aria-label="光點沿方形依序引導吸氣、吸氣後停留、吐氣、吐氣後停留"></canvas></div>
<section class="settings" aria-label="練習設定">
<div class="settings-row timing">
<div class="setting"><label for="bpm">拍速</label><div class="value-row"><input id="bpm" type="number" min="40" max="200" step="1" value="60"><span>BPM</span><small>40–200</small></div><input id="bpmRange" type="range" min="40" max="200" value="60" aria-label="拍速滑桿"></div>
<div class="setting"><label for="beats">每階段拍數</label><div class="value-row"><input id="beats" type="number" min="1" max="12" step="1" value="4"><span>拍</span><small>1–12</small></div><input id="beatsRange" type="range" min="1" max="12" value="4" aria-label="每階段拍數滑桿"></div>
<div class="setting"><label class="check-label" for="limited"><input id="limited" type="checkbox">設定練習組數</label><div class="value-row"><input id="rounds" type="number" min="1" max="999" step="1" value="4" disabled aria-label="練習組數"><span>組</span></div><small>未勾選：不限組數</small></div>

<div class="setting volume-control"><div class="volume-heading">音量 <output id="volumeValue" title="相對最大輸出音量；不是環境聲壓值">−3.1 dB</output></div><div class="knob-row"><div id="volumeKnob" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-valuetext="−3.1 dB"><span></span></div><small>上下拖曳調整<br>也可使用方向鍵</small></div></div>
</div>
<div id="duration" aria-live="polite"></div>
</section>
<div class="actions"><button class="primary" id="play">開始練習</button><button id="reset">重新開始</button><button id="full">全螢幕</button></div>
<p id="status" role="status" aria-live="polite">按開始後，先依設定拍速倒數 4 拍，再開始練習。調整參數會重新預備。</p>

</main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('visual'),ctx=canvas.getContext('2d');
let bpm=60,beats=4,running=false,elapsed=0;
let started=false;
let rounds=4,limited=false,completed=false,audio=null,audioBus=null,timer=null,nextBeat=0,audioOrigin=0,deadline=Infinity;
const voices=new Set();
const voiceData=[];
let voiceBuffers=[],volume=.7;
function totalDuration(){return limited?state(0).cycle*rounds:Infinity;}
let chineseVoices=[];const speechTimers=new Set();
function loadVoices(){chineseVoices=window.speechSynthesis?window.speechSynthesis.getVoices().filter(v=>(/^zh|^cmn/.test(v.lang))&&/Ting[\s-]?Ting|婷婷/i.test(v.name)):[];}
async function prepareAudio(){if(!window.speechSynthesis)throw Error('此瀏覽器不支援語音，請用 Safari 或 Chrome。');loadVoices();if(!chineseVoices.length)throw Error('尚未找到「婷婷」中文語音，請在系統安裝婷婷（Tingting）後重新開啟此頁。');if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();audioBus=audio.createGain();audioBus.gain.value=volume;audioBus.connect(audio.destination);}await audio.resume();}
function speakNumber(at,index,preparing=false){const id=setTimeout(()=>{speechTimers.delete(id);window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(!preparing&&index%beats===0?['吸氣','停留','吐氣','停留'][Math.floor(index/beats)%4]:['一','二','三','四','五','六','七','八','九','十','十一','十二'][preparing?index:index%beats]);utterance.voice=chineseVoices[0];utterance.lang=utterance.voice.lang;utterance.volume=volume;utterance.rate=Math.max(1,Math.min(2.5,bpm/85));window.speechSynthesis.speak(utterance);},Math.max(0,(at-audio.currentTime)*1000));speechTimers.add(id);}
function setVolume(value){volume=Math.max(0,Math.min(100,Math.round(value)))/100;const db=volume===0?'−∞ dB':(20*Math.log10(volume)).toFixed(1).replace('-','−')+' dB';$('volumeValue').textContent=db;$('volumeKnob').setAttribute('aria-valuetext',db);$('volumeKnob').setAttribute('aria-valuenow',Math.round(volume*100));$('volumeKnob').style.setProperty('--angle',(volume*270-135)+'deg');if(audioBus)audioBus.gain.setTargetAtTime(volume,audio.currentTime,.015);}
$('volumeKnob').onkeydown=e=>{let value=volume*100;if(e.key==='ArrowUp'||e.key==='ArrowRight')value+=5;else if(e.key==='ArrowDown'||e.key==='ArrowLeft')value-=5;else if(e.key==='Home')value=0;else if(e.key==='End')value=100;else return;e.preventDefault();setVolume(value);};
$('volumeKnob').onpointerdown=e=>{e.preventDefault();const knob=$('volumeKnob'),start=e.clientY,initial=volume*100;knob.focus();knob.setPointerCapture(e.pointerId);knob.onpointermove=m=>setVolume(initial+(start-m.clientY));knob.onpointerup=knob.onpointercancel=()=>{knob.onpointermove=null;};};
function stopSound(){for(const id of speechTimers)clearTimeout(id);speechTimers.clear();window.speechSynthesis?.cancel();clearInterval(timer);timer=null;for(const o of voices){try{o.stop();}catch{}}voices.clear();}
function startSound(offset,end){stopSound();deadline=end;audioOrigin=audio.currentTime+.06-offset;nextBeat=Math.ceil((offset-1e-7)/(60/bpm));
 function schedule(){const now=audio.currentTime;while(audioOrigin+nextBeat*60/bpm<now+.12){const beatTime=nextBeat*60/bpm;if(beatTime>=deadline-1e-7)return;const at=audioOrigin+beatTime;if(at>=now-.01)speakNumber(Math.max(now,at),nextBeat<0?-nextBeat-1:nextBeat,nextBeat<0);nextBeat++;}}
 schedule();timer=setInterval(schedule,25);
}
// Spoken completion message uses the selected Chinese voice and volume.
let celebration=null;
function stopCelebration(){if(celebration){window.speechSynthesis?.cancel();celebration=null;}}
function playCelebration(){
 stopCelebration();if(!window.speechSynthesis)return;
 const utterance=new SpeechSynthesisUtterance('恭喜你完成');
 utterance.voice=chineseVoices[0];
 utterance.lang=utterance.voice?.lang||'zh-TW';utterance.volume=volume;utterance.rate=1;
 celebration=utterance;utterance.onend=utterance.onerror=()=>{if(celebration===utterance)celebration=null;};
 window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);
}
function finish(){elapsed=totalDuration();running=false;completed=true;stopSound();if(limited)playCelebration();$('play').textContent='再練習一次';$('status').textContent='恭喜你，完成。';}
const names=['吸氣','停留','吐氣','停留'],subs=['緩緩吸入','吸氣後停留','緩緩吐出','吐氣後停留'],colors=['#83e1cf','#b7b4fa','#8ac9f7','#efca91'];
function state(t,b=bpm,n=beats){const unit=60/b*n,cycle=unit*4,within=((t%cycle)+cycle)%cycle,phase=Math.min(3,Math.floor(within/unit)),p=(within-phase*unit)/unit;return {phase,p,beat:Math.min(n,Math.floor(p*n)+1),unit,cycle};}
function text(s,x,y,size,color='#edf5f6',align='center'){ctx.fillStyle=color;ctx.font=`500 ${size}px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif`;ctx.textAlign=align;ctx.fillText(s,x,y);}
function draw(t){const s=state(t),i=s.phase,p=s.p,col=colors[i];ctx.fillStyle='#0b1420';ctx.fillRect(0,0,1600,900);text('BOX BREATHING',80,78,23,'#a8bcc8','left');text(`${bpm} BPM  ·  每階段 ${beats} 拍`,1520,78,23,'#a8bcc8','right');
if(t<0){const remaining=Math.min(4,Math.max(1,Math.ceil(-t/(60/bpm)-1e-7)));text('預備',800,320,60,'#efca91');text(String(remaining),800,505,140);text('倒數後開始吸氣',800,590,30,'#a8bcc8');text(running?'跟著倒數，準備開始': '預備拍已暫停',800,838,23,'#a8bcc8');return;}
if(completed){text('恭喜你，完成。',800,445,76,'#83e1cf');text(`已完成 ${rounds} 組呼吸練習`,800,525,32,'#a8bcc8');return;}
const pts=[[550,690],[550,230],[1010,230],[1010,690],[550,690]];
ctx.strokeStyle='#304455';ctx.lineWidth=5;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...pts[0]);for(let k=1;k<5;k++)ctx.lineTo(...pts[k]);ctx.stroke();
for(let k=0;k<=i;k++){ctx.strokeStyle=colors[k];ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(...pts[k]);const f=k===i?p:1;ctx.lineTo(pts[k][0]+(pts[k+1][0]-pts[k][0])*f,pts[k][1]+(pts[k+1][1]-pts[k][1])*f);ctx.stroke();}
text('01  吸氣 ↑',415,470,28,i===0?col:'#8fa5b5');text('02  停留 →',780,186,28,i===1?col:'#8fa5b5');text('03  吐氣 ↓',1150,470,28,i===2?col:'#8fa5b5');text('04  停留 ←',780,753,28,i===3?col:'#8fa5b5');
const x=pts[i][0]+(pts[i+1][0]-pts[i][0])*p,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*p;// Pulse uses the same beat clock as movement and speech; pausing freezes it.
const beatFraction=((t/(60/bpm))%1+1)%1,pulse=Math.pow(1-beatFraction,3);
ctx.save();ctx.fillStyle=col;ctx.globalAlpha=.08+.22*pulse;
ctx.beginPath();ctx.arc(x,y,36+12*pulse,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=.5+.5*pulse;ctx.shadowColor=col;ctx.shadowBlur=8+22*pulse;
ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.fill();ctx.restore();
text(names[i],780,365,54,col);text(subs[i],780,415,24,'#a8bcc8');text(String(s.beat),780,543,110);text(`/ ${beats} 拍`,780,591,24,'#a8bcc8');
for(let k=0;k<beats;k++){ctx.fillStyle=k<s.beat?col:'#304455';ctx.beginPath();ctx.arc(780+(k-(beats-1)/2)*24,631,5,0,Math.PI*2);ctx.fill();}
text(`第 ${Math.floor(t/state(0).cycle)+1} 組${limited?' / '+rounds+' 組':' · 不限組數'}`,800,120,24,'#a8bcc8');
text(running?'跟著光點完成四個階段':elapsed?'已暫停':'準備開始',800,838,23,'#a8bcc8');}
function time(){return running?Math.max(-4*60/bpm,audio.currentTime-audioOrigin):elapsed;}
function loop(){if(running&&time()>=totalDuration())finish();draw(time());requestAnimationFrame(loop);}
function reset(){stopCelebration();started=false;stopSound();completed=false;running=false;elapsed=0;$('play').textContent='開始練習';draw(0);}
function update(){bpm=Math.max(40,Math.min(200,Math.round(Number($('bpm').value)||60)));beats=Math.max(1,Math.min(12,Math.round(Number($('beats').value)||4)));$('bpm').value=$('bpmRange').value=bpm;$('beats').value=$('beatsRange').value=beats;limited=$('limited').checked;rounds=Math.max(1,Math.min(999,Math.round(Number($('rounds').value)||1)));$('rounds').value=rounds;$('rounds').disabled=!limited;$('duration').textContent=`每階段 ${(60/bpm*beats).toFixed(1)} 秒 · 一循環 ${(240/bpm*beats).toFixed(1)} 秒`;reset();}
for(const id of ['bpm','beats']){$(id).onchange=update;$(id+'Range').oninput=()=>{$(id).value=$(id+'Range').value;update();};}
$('limited').onchange=$('rounds').onchange=update;
$('play').onclick=async()=>{if(running){elapsed=time();running=false;stopSound();}else{if(completed)reset();$('play').disabled=true;try{await prepareAudio();if(document.hidden)return;if(!started){elapsed=-4*60/bpm;started=true;}startSound(elapsed,totalDuration());running=true;$('status').textContent=limited?`練習 ${rounds} 組；四個階段完成為一組。`:'不限組數，按暫停即可休息。';}catch(e){$('status').textContent='無法啟用音效：'+e.message;}finally{$('play').disabled=false;}}$('play').textContent=running?'暫停':'繼續練習';};$('reset').onclick=reset;
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen();}catch(e){$('status').textContent='此瀏覽器無法進入全螢幕，請使用瀏覽器的全螢幕功能。';}};
document.addEventListener('keydown',e=>{if(/INPUT|BUTTON|SUMMARY/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click();}if(e.key.toLowerCase()==='f')$('full').click();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){elapsed=time();running=false;stopSound();$('play').textContent='繼續練習';}});
if(window.speechSynthesis){window.speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();}
window.boxBreathing={state};update();requestAnimationFrame(loop);
</script>
<script>
(function(){
 const workspace=document.querySelector('main');
 function fitWorkspace(){
  if(document.fullscreenElement)return;
  const width=document.documentElement.clientWidth,height=window.visualViewport?window.visualViewport.height:window.innerHeight;
  const scale=Math.min(1,(height-4)/workspace.offsetHeight,(width-2)/workspace.offsetWidth);
  workspace.style.setProperty('--screen-scale',Math.max(.05,scale));
 }
 new ResizeObserver(fitWorkspace).observe(workspace);
 window.addEventListener('resize',fitWorkspace);
 window.visualViewport?.addEventListener('resize',fitWorkspace);
 document.addEventListener('fullscreenchange',fitWorkspace);
 document.fonts.ready.then(fitWorkspace);
 fitWorkspace();
})();
</script></body></html>
